[package]
name = "nocturne"
version = "0.1.0"
description = "Nocturne — desktop client for VK Music"
authors = ["propanesmoker123"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "nocturne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
souvlaki = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
